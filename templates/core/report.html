{% extends "base.html" %}{% block title %}周报{% endblock %}{% block content %}<div class="page"><div class="page-head"><div><span class="eyebrow">自动归集</span><h1>项目周报</h1></div></div><form class="filters"><label>开始<input type="date" name="start" value="{{ start }}"></label><label>结束<input type="date" name="end" value="{{ end }}"></label><button class="button">重新生成</button></form><section class="card"><div class="section-head"><h2>Markdown</h2><button class="button" type="button" onclick="navigator.clipboard.writeText(document.getElementById('report').value);this.textContent='已复制'">复制</button></div><textarea id="report" rows="28">{{ markdown }}</textarea></section></div>{% endblock %}
