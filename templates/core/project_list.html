{% extends "base.html" %}{% block title %}项目{% endblock %}{% block content %}<div class="page"><div class="page-head"><div><span class="eyebrow">全局视角</span><h1>项目</h1></div><a class="button primary" href="{% url 'project_create' %}">新建项目</a></div><div class="data-list">{% for p in projects %}<a class="surface project-card" href="{% url 'project_detail' p.pk %}"><span class="badge">{{ p.get_status_display }}</span><h2>{{ p.name }}</h2><p>{{ p.description|default:'暂无说明' }}</p><div class="progress" role="progressbar" aria-label="项目进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ p.progress }}"><i style="width:{{ p.progress }}%"></i></div><strong>{{ p.progress }}%</strong></a>{% empty %}<div class="empty-state">暂无项目</div>{% endfor %}</div></div>{% endblock %}
