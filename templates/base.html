{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}项目进度台{% endblock %}</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><script src="https://unpkg.com/htmx.org@2.0.8" defer></script></head><body>{% if user.is_authenticated %}<header class="topbar"><a class="brand" href="/">进度台</a><nav><a href="{% url 'meeting_create' %}">快速记录</a><a href="{% url 'project_list' %}">项目</a><a href="{% url 'task_list' %}">任务</a><a href="{% url 'person_list' %}">人员</a><a href="{% url 'report' %}">周报</a><a href="{% url 'settings' %}">设置</a></nav><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-button">退出</button></form></header>{% endif %}<main>{% if messages %}{% for message in messages %}<div class="toast">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
