# Standalone server stack: do not merge this with docker-compose.yml.
x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?请在 .env.server 中设置 DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "false"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN:?请设置域名，不含协议或路径},127.0.0.1
  CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN:?请设置 APP_DOMAIN}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}

x-app-service: &app-service
  image: meeting-progress-tracker:server
  build:
    context: .
    args:
      PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
  restart: unless-stopped
  init: true
  volumes:
    - tracker_data:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app-service
    expose:
      - "8000"
    environment:
      <<: *app-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env.server 中设置 ADMIN_PASSWORD}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    <<: *app-service
    command: ["python", "manage.py", "run_parse_worker"]
    environment: *app-environment
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 210s
    healthcheck:
      test: ["CMD", "python", "manage.py", "run_parse_worker", "--check"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请设置 APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?请设置证书通知邮箱}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tracker_data:
    name: ${TRACKER_DATA_VOLUME:-meeting-progress-tracker_tracker_data}
  caddy_data:
  caddy_config:
