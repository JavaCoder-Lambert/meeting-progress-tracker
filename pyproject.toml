[project]
name = "meeting-progress-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-django>=4.11,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tracker.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker", "core"]
